[workspace]
resolver = "3"
members = ["crates/iptv-core", "crates/iptv-nav", "crates/iptv-settings", "crates/iptv-app"]
# nsh generates its own Cargo workspaces under the app crate.
exclude = ["crates/iptv-app/.nsh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
iptv-core = { path = "crates/iptv-core" }
iptv-nav = { path = "crates/iptv-nav" }
iptv-settings = { path = "crates/iptv-settings" }
# The NSH fork checkout (branch tv-keys); upstream PR planned.
nsh-core = { path = "/home/blackmyth/src/nsh/crates/nsh-core" }
nsh-base = { path = "/home/blackmyth/src/nsh/crates/nsh-base" }
nsh-platform-linux = { path = "/home/blackmyth/src/nsh/crates/nsh-platform-linux", default-features = false }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
