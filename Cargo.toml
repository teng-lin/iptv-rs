[workspace]
resolver = "3"
members = [
    "crates/iptv-core",
    "crates/iptv-nav",
    "crates/iptv-settings",
    "crates/iptv-epg",
    "crates/iptv-providers",
    "crates/iptv-guide",
    "crates/iptv-import",
    "crates/iptv-net",
    "crates/iptv-store-sqlite",
    "crates/iptv-search",
    "crates/iptv-app",
]
# nsh generates its own Cargo workspaces under the app crate.
exclude = ["crates/iptv-app/.nsh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
iptv-core = { path = "crates/iptv-core" }
iptv-nav = { path = "crates/iptv-nav" }
iptv-settings = { path = "crates/iptv-settings" }
iptv-epg = { path = "crates/iptv-epg" }
iptv-guide = { path = "crates/iptv-guide" }
iptv-search = { path = "crates/iptv-search" }
# The NSH fork checkout (branch tv-keys); upstream PR planned.
nsh-core = { path = "../nsh/crates/nsh-core" }
# No editor, highlighting, charts or terminal: an IPTV app shows none
# (nsh.json "features" keeps them out of the runners too).
nsh-base = { path = "../nsh/crates/nsh-base", default-features = false }
nsh-platform-linux = { path = "../nsh/crates/nsh-platform-linux", default-features = false }
nsh-platform-macos = { path = "../nsh/crates/nsh-platform-macos", default-features = false }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
# iptv-providers (sans-IO, wasm-safe)
iptv-providers = { path = "crates/iptv-providers" }
url = "2.5"
percent-encoding = "2.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha1_smol = "1"
# Import pipeline (core, wasm-safe) and its native network adapter
iptv-import = { path = "crates/iptv-import" }
iptv-net = { path = "crates/iptv-net" }
# iptv-store-sqlite (native adapter; bundled SQLite builds for Android via the NDK)
iptv-store-sqlite = { path = "crates/iptv-store-sqlite" }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
tempfile = "3"
