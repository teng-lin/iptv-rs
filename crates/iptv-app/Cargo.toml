[package]
name = "iptv-app"
description = "The NSH shell of iptv-rs: TV + tablet screens rendering iptv-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
iptv-core.workspace = true
iptv-nav.workspace = true
iptv-guide.workspace = true
iptv-epg.workspace = true
iptv-providers.workspace = true
iptv-import.workspace = true
iptv-net.workspace = true
iptv-store-sqlite.workspace = true
iptv-search.workspace = true
iptv-settings.workspace = true
futures-channel = "0.3"
tokio = { version = "1", default-features = false, features = ["rt"] }
nsh-core.workspace = true
nsh-base.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# localtime_r for the device's UTC offset (time.rs).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

# The macOS desktop: NSH's AppKit backend, and `tv.player` on libmpv drawing
# into a CAOpenGLLayer (`src/mpv/mac.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-quartz-core",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-video",
  "objc2-open-gl",
  "CALayer",
  "CAOpenGLLayer",
] }
objc2-open-gl = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGLCurrent",
  "CGLTypes",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase"] }

# iOS and iPadOS: NSH's UIKit backend, and `tv.player` on MPVKit's libmpv
# drawing into a CAEAGLLayer (`src/mpv/ios.rs`; `tools/fetch-mpvkit.sh`,
# linked by build.rs).
[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGeometry",
  "NSObject",
  "NSString",
  "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "UIEvent",
  "UIResponder",
  "UIScreen",
  "UIView",
  "UIWindow",
] }

[dev-dependencies]
# Headless runs of the app: what a press reaches (tests/app/pointer.rs).
nsh-engine.workspace = true
nsh-testing.workspace = true
tempfile.workspace = true
