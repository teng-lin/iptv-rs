[package]
name = "iptv-search"
description = "Search layer of iptv-rs: text folding shared with EPG matching, channel and programme search, search history and the search screen's state machine. No NSH, no I/O, no clock; must build for wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
iptv-core.workspace = true
iptv-epg.workspace = true
# Same crate and features as iptv-epg (only `is_combining_mark` is used here).
unicode-normalization = { version = "0.1.24", default-features = false }

[lints]
workspace = true
