[package]
name = "iptv-store-sqlite"
description = "Native SQLite store of iptv-rs: sources, provider catalog replaced on refresh, user overlays keyed by stable ids. Bundled SQLite (builds for Android via the NDK); not wasm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
iptv-providers.workspace = true
iptv-epg.workspace = true
iptv-import.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
serde_json.workspace = true

zeroize = "1.8"

[dev-dependencies]
tempfile.workspace = true
iptv-guide.workspace = true
# examples/epg_import_bench.rs: the app's guide import over HTTP.
iptv-net.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true

# Apple uses SQLCipher's CommonCrypto backend; avoid a second OpenSSL beside MPVKit.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
