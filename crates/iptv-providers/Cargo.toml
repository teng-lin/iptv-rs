[package]
name = "iptv-providers"
description = "Provider layer of iptv-rs: M3U/M3U8 parser, Xtream Codes and Stalker/Ministra clients. Sans-IO (builds requests, parses responses), no NSH, must build for wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
iptv-core.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
url.workspace = true
percent-encoding.workspace = true
xxhash-rust.workspace = true
sha1_smol.workspace = true
# Wipes secrets when they are dropped; pure Rust, builds for wasm32.
zeroize = "1.8"

[lints]
workspace = true
