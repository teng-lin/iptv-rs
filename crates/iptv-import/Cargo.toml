[package]
name = "iptv-import"
description = "Import pipeline of iptv-rs: drives the sans-IO provider clients and the XMLTV parser through an abstract async Fetch. Runtime-agnostic (no tokio), no NSH; must build for wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
iptv-providers.workspace = true
iptv-epg.workspace = true
iptv-settings.workspace = true
# Pure-Rust gzip (miniz_oxide) for `.m3u.gz` playlists; builds for wasm32.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
serde_json.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
