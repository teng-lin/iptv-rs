name: Build prerequisites
description: Check out the pinned NSH fork alongside this repository
inputs:
  cache:
    description: Restore and save shared build caches
    default: 'true'
  cache-on-failure:
    description: Preserve compiled dependencies when a package validation fails
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: teng-lin/nsh
        ref: 4439410f78174fadacc35f6677b8a767ff206c90
        path: nsh-source
        persist-credentials: false
    - shell: bash
      run: mv nsh-source ../nsh
    - shell: bash
      run: |
        if [ "${RUNNER_OS}" = Linux ]; then
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libmpv-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            pkg-config clang cmake ninja-build
        else
          brew install mpv pkg-config
        fi
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: 1.99.1
        components: clippy, rustfmt
        targets: wasm32-unknown-unknown
    - shell: bash
      run: |
        source tools/ci/locked-build-env.sh
        echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.cache == 'true'
      with:
        cache-on-failure: ${{ inputs.cache-on-failure }}
        workspaces: |
          .
          ../nsh
    - shell: bash
      run: cargo install cargo-deny --version 0.20.2 --locked
