name: Build prerequisites
description: Check out the pinned NSH fork alongside this repository
inputs:
  cache:
    description: Restore and save shared build caches
    default: 'true'
  cache-on-failure:
    description: Preserve compiled dependencies when a package validation fails
    default: 'false'
runs:
  using: composite
  steps:
    # nsh.rev and rust-toolchain.toml are the only places that name these pins.
    - name: Read the pinned NSH revision and Rust toolchain
      id: pins
      shell: bash
      run: python3 tools/ci/pins.py >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: teng-lin/nsh
        ref: ${{ steps.pins.outputs.nsh }}
        path: nsh-source
        persist-credentials: false
    - shell: bash
      run: mv nsh-source ../nsh
    - shell: bash
      run: |
        if [ "${RUNNER_OS}" = Linux ]; then
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libmpv-dev libssl-dev libdbus-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            pkg-config clang cmake ninja-build ffmpeg
        else
          brew install mpv pkg-config ffmpeg
        fi
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: ${{ steps.pins.outputs.toolchain }}
        components: clippy, rustfmt
        targets: wasm32-unknown-unknown
    - shell: bash
      run: |
        source tools/ci/locked-build-env.sh
        echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.cache == 'true'
      with:
        cache-on-failure: ${{ inputs.cache-on-failure }}
        # Per-PR copies of these gigabyte-sized caches evict the reusable tools.
        # PRs can restore master caches; only master refreshes bulk dependencies.
        save-if: ${{ github.ref == 'refs/heads/master' }}
        workspaces: |
          .
          ../nsh
    - shell: bash
      run: cargo install cargo-deny --version 0.20.2 --locked
