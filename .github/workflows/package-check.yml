name: Package checks
on:
  pull_request:
    paths:
      - '.github/workflows/package-check.yml'
      - '.github/actions/setup/**'
      - '.github/actions/nsh-cli/**'
      - '.cargo/config'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'crates/iptv-app/build.rs'
      - 'crates/iptv-app/nsh.json'
      - 'crates/iptv-app/icon.png'
      - 'crates/iptv-app/fonts/**'
      - 'rust-toolchain.toml'
      - 'nsh.rev'
      - 'about.toml'
      - 'tools/ci/**'
      - 'tools/package-macos.sh'
      - 'tools/bundle-macos.py'
      - 'tools/mpv-runtime-unix/**'
      - 'tools/mpv-runtime/prepare.py'
  workflow_dispatch:
# Superseded PR checks need not keep occupying runners. Releases are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('packages-pr-{0}', github.event.pull_request.number) || format('packages-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  desktop-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Package prerequisites
        shell: bash
        run: |
          python3 tools/ci/version.py
          cargo install cargo-about --version 0.9.3 --features cli --locked
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      - uses: ./.github/actions/nsh-cli
      - name: Linux package installation and smoke tests
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ruby-dev rpm zstd libarchive-tools patchelf file desktop-file-utils \
            libgirepository1.0-dev librsvg2-dev xvfb x11-utils xauth dbus-x11
          sudo gem install fpm -v 1.16.0 --no-document
          bash tools/ci/setup-linux-packaging.sh
          export PATH="$RUNNER_TEMP/linux-packaging:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1 CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          bash tools/ci/package-linux.sh
          bash tools/ci/check-linux-packages.sh
          # As in a release: every bundled system library's source must be
          # fetchable (libmpv's is retained with its pinned runtime release).
          bash tools/ci/enable-deb-src.sh
          python3 tools/ci/native-sources.py linux target/Patina.AppDir \
            "target/native-sources/Patina-$VERSION-linux-native-sources.tar"
      - name: macOS ad hoc package installation and smoke test
        if: matrix.platform == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          bash tools/package-macos.sh
          bash tools/ci/package-macos.sh
          mkdir -p "$RUNNER_TEMP/signing-download"
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/signing-download/signing-input.tar" target/package
          mv target/package target/package-before-transfer
          PACKAGE_PLATFORM=macos python3 tools/ci/unpack-signing-input.py
          IPTV_SIGNING_STAGE=1 bash tools/ci/package-macos.sh
          bash tools/ci/smoke-macos-dmg.sh
          # As in a release: every bundled library's source must be fetchable.
          python3 tools/ci/native-sources.py macos target/package/Patina.app \
            "target/native-sources/Patina-$VERSION-macos-native-sources.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      # Only the manifest: what was fetched from where, for review.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sources-manifest-${{ matrix.platform }}
          path: target/native-sources/Patina-*-native-sources.json
          if-no-files-found: error
