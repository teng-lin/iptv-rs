name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  package:
    needs: tests
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: android
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Set release metadata
        shell: bash
        run: |
          python3 tools/ci/version.py
          echo "NSH=$(cd ../nsh && pwd)/target/release/nsh" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --manifest-path ../nsh/Cargo.toml -p nsh-cli
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ruby-dev rpm zstd
          sudo gem install fpm -v 1.16.0 --no-document
          curl -fL https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage -o /tmp/linuxdeploy
          chmod +x /tmp/linuxdeploy
          sudo mv /tmp/linuxdeploy /usr/local/bin/linuxdeploy
          APPIMAGE_EXTRACT_AND_RUN=1 bash tools/ci/package-linux.sh
      - name: Android tablet and TV
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE"
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;30.0.16248370"
          rustup target add aarch64-linux-android
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash tools/sync-host.sh --release
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          (cd hosts/android && ./gradlew assembleRelease bundleRelease)
          mkdir -p dist
          cp hosts/android/app/build/outputs/apk/release/*.apk "dist/Patina-$VERSION-android-tablet-tv.apk"
          cp hosts/android/app/build/outputs/bundle/release/*.aab "dist/Patina-$VERSION-android-tablet-tv.aab"
      - name: macOS disk image
        if: matrix.platform == 'macos'
        run: |
          bash tools/package-macos.sh
          mkdir -p dist target/dmg
          cp -R target/package/Patina.app target/dmg/
          ln -s /Applications target/dmg/Applications
          hdiutil create -volname Patina -srcfolder target/dmg -ov -format UDZO "dist/Patina-$VERSION-macos-arm64.dmg"
      - name: Signed iPad package
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
        run: bash tools/ci/package-ios.sh
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/ios.p12" "$RUNNER_TEMP/ios.mobileprovision"
          if [ "${{ matrix.platform }}" = ios ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          gh release create "$TAG" --verify-tag --draft --generate-notes
          gh release upload "$TAG" ./*
          gh release edit "$TAG" --draft=false
