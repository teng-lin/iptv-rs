name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to package (all requires Apple signing secrets)
        type: choice
        default: android-desktop
        options: [android-desktop, android, desktop, all]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms || 'android-desktop' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          selection = os.environ["PLATFORMS"]
          platforms = []
          if selection in ("android", "android-desktop", "all"):
              platforms.append({"platform": "android", "os": "ubuntu-24.04"})
          if selection in ("desktop", "android-desktop", "all"):
              platforms += [
                  {"platform": "linux", "os": "ubuntu-24.04"},
                  {"platform": "macos", "os": "macos-15"},
              ]
          if selection == "all":
              platforms.append({"platform": "ios", "os": "macos-15"})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": platforms}) + "\n")
          PY
  tests:
    uses: ./.github/workflows/ci.yml
  package:
    needs: plan
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-on-failure: 'true'
      - name: Set release metadata
        shell: bash
        run: |
          python3 tools/ci/version.py
          echo "NSH=$(cd ../nsh && pwd)/target/release/nsh" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --manifest-path ../nsh/Cargo.toml -p nsh-cli
        if: matrix.platform != 'android'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      - uses: ./.github/actions/android
        if: matrix.platform == 'android'
      - name: Build Android native library
        if: matrix.platform == 'android'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash tools/sync-host.sh --release
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ruby-dev rpm zstd libarchive-tools patchelf file desktop-file-utils \
            libgirepository1.0-dev librsvg2-dev xvfb x11-utils xauth dbus-x11
          sudo gem install fpm -v 1.16.0 --no-document
          bash tools/ci/setup-linux-packaging.sh
          export PATH="$RUNNER_TEMP/linux-packaging:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1 CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          bash tools/ci/package-linux.sh
          bash tools/ci/check-linux-packages.sh
      - name: Android tablet and TV
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          bash tools/ci/package-android.sh
      - name: macOS disk image
        if: matrix.platform == 'macos'
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          bash tools/ci/package-macos.sh
      - name: Signed iPad package
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
        run: bash tools/ci/package-ios.sh
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/ios.p12" "$RUNNER_TEMP/ios.mobileprovision"
          if [ "${{ matrix.platform }}" = ios ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          gh release create "$TAG" --verify-tag --draft --generate-notes
          gh release upload "$TAG" ./*
          gh release edit "$TAG" --draft=false
