name: Import stress
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 100k channels and 100k VOD, bounded allocations and elapsed time
        run: cargo test --locked -p iptv-store-sqlite --test catalog_stream_memory -- --nocapture
  fuzz:
    # Five minutes for every fuzz target. The corpus each run grows is cached
    # per target and restored by the next run and by pull request passes;
    # crashing inputs are uploaded as artifacts (.github/workflows/fuzz.yml).
    uses: ./.github/workflows/fuzz.yml
    with:
      seconds: 300
      save-corpus: true
