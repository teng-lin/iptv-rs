name: Import stress
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 100k channels and 100k VOD, bounded allocations and elapsed time
        run: cargo test --locked -p iptv-store-sqlite --test catalog_stream_memory -- --nocapture
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-10-24
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz synthetic parser inputs for five minutes
        run: bash tools/ci/fuzz-imports.sh 300
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-imports
          path: fuzz/artifacts/
          if-no-files-found: ignore
