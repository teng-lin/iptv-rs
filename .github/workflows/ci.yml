name: Tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      skip_android:
        description: Release packaging builds and signs Android itself
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash tools/check.sh
  android:
    if: ${{ !inputs.skip_android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/android
      - name: Build Android native library
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: ABIS=arm64-v8a bash tools/sync-host.sh
      - name: Build Android APK and bundle
        working-directory: hosts/android
        run: ./gradlew --no-daemon assembleDebug bundleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify hosts/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            hosts/android/app/build/outputs/apk/debug/*.apk
            hosts/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
