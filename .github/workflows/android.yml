name: Android packages
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
# Cancel only superseded PR builds; keep pushes and manual runs independent.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('android-pr-{0}', github.event.pull_request.number) || format('android-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.paths.outputs.package }}
      compile: ${{ steps.paths.outputs.compile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A pull request's changed paths need both sides of the comparison.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The path lists and their tests: tools/ci/android-changes.py.
        run: python3 tools/ci/android-changes.py >> "$GITHUB_OUTPUT"
  android-check:
    needs: changes
    # Rust sources are not packaging inputs, so the android job below skips
    # pull requests that change only them. This cheaper job compiles the app
    # library for Android instead: no other pull request check builds
    # cfg(target_os = "android") code. Like the android job it stays present
    # when skipped, and a detection failure fails it, so it can be required.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compile == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install the NDK and the Android Rust target
        run: |
          # Runner images preset ANDROID_NDK_HOME to their own default NDK.
          source tools/ci/android-ndk-env.sh
          sdkmanager "ndk;$IPTV_ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$IPTV_ANDROID_NDK" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: Compile the app library for Android
        run: bash tools/ci/check-android.sh
  android:
    needs: changes
    # Keep the required android check present even when packaging is skipped.
    # A detection failure must fail this check, not silently skip it. Unlike
    # always(), !cancelled() lets superseded PR runs release their runner.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.package == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/android
      - name: Build Android native library
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: ABIS=arm64-v8a bash tools/sync-host.sh
      - name: Generate and stage Android notices
        run: |
          cargo install cargo-about --version 0.9.3 --features cli --locked
          bash tools/ci/notices.sh
          (cd hosts/android && ./gradlew --no-daemon :app:generateLicenseReport)
          mkdir -p hosts/android/app/build/nsh/assets/notices
          cp -R target/notices/. hosts/android/app/build/nsh/assets/notices/
          cp -R hosts/android/app/build/reports/dependency-license hosts/android/app/build/nsh/assets/notices/gradle
      - name: Build Android APK and bundle
        working-directory: hosts/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify hosts/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug
          path: |
            hosts/android/app/build/outputs/apk/debug/*.apk
            hosts/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
