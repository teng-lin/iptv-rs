# The packaged application is AGPL-3.0-only; dependency notices ship with it.
[advisories]
version = 2
# NSH uses this font parser; there is no patched release. Replace it in the
# NSH font backend before widening font input beyond bundled/system fonts.
ignore = [{ id = "RUSTSEC-2026-0192", reason = "Transitive NSH font parser is unmaintained; migration to skrifa tracked for the NSH fork." }]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-only", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "CDLA-Permissive-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "ISC",
  "MIT", "MPL-2.0", "Unicode-3.0", "Zlib",
  # SQLCipher bundles SQLite public-domain blessing and permissive extension code.
  "blessing", "WTFPL",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
